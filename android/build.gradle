buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

apply from: new File(rootProject.projectDir, "node.gradle")

def nodeExecutable = resolveNodeExecutable()
def nodeBinDir = new File(nodeExecutable).parent

allprojects {
    ext {
        REACT_NATIVE_NODE_MODULES_DIR = file("${rootDir}/../node_modules/react-native")
    }
}

// Ensure node is on PATH for library Gradle scripts that shell out to `node` during configuration.
def existingPath = System.getenv("PATH") ?: ""
def augmentedPath = "$nodeBinDir:$existingPath"
gradle.projectsLoaded {
    rootProject.allprojects { project ->
        project.plugins.withId("com.android.library") {
            project.tasks.configureEach { task ->
                if (task.metaClass.respondsTo(task, "environment", String, Object)) {
                    task.environment("PATH", augmentedPath)
                    task.environment("NODE_BINARY", nodeExecutable)
                }
            }
        }
    }
}
