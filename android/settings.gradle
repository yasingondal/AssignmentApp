pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }

plugins { id("com.facebook.react.settings") }

def resolveNodeExecutable = {
    def nodeEnv = System.getenv("NODE_BINARY")
    if (nodeEnv != null && !nodeEnv.isEmpty()) {
        return nodeEnv
    }

    def home = System.getProperty("user.home")
    def nvmDir = new File("${home}/.nvm/versions/node")
    if (nvmDir.exists()) {
        def versions = nvmDir.listFiles()?.findAll { it.isDirectory() }?.sort()?.reverse()
        if (versions != null && !versions.isEmpty()) {
            def nodeFile = new File(versions[0], "bin/node")
            if (nodeFile.exists()) {
                return nodeFile.absolutePath
            }
        }
    }

    def candidates = ["/opt/homebrew/bin/node", "/usr/local/bin/node"]
    for (path in candidates) {
        if (new File(path).exists()) {
            return path
        }
    }

    return "node"
}

def nodeExecutable = resolveNodeExecutable()
def nodeBinDir = new File(nodeExecutable).parent
def inheritedPath = System.getenv("PATH") ?: "/usr/bin:/bin"
System.setProperty("PATH", "$nodeBinDir:$inheritedPath")

def cliPath = new File(settingsDir, "../node_modules/@react-native-community/cli/build/bin.js").absolutePath

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand([nodeExecutable, cliPath, "config"])
}

rootProject.name = 'AssignmentApp'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
